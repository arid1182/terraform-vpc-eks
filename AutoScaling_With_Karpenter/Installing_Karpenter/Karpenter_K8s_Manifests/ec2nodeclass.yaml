apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: ec2nodeclass
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - aliase: al2023@latest
  role: "arn:aws:iam::180789647333:role/retail-dev-karpenter-node-role"
  subnetSelectorTerms:
    - tags:
        kubernetes.io/cluster/retails-dev-eks: owned
        kubernetes.io/role/internal-els: "1"
  securityGroupSelectorTerms:
    - tags:
        kubernetes.io/cluster/retail-dev-demo: owned
  tags:
    karpenter.sh/discovery: retail-dev-eks
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  metadataOptions:
    httpTokens: required
    httpPutResponseHopLimit: 2